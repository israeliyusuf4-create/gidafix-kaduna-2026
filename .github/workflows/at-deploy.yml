
name: Publish GidaFix to Africa's Talking

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout GidaFix
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Africa's Talking Registry
        uses: docker/login-action@v3
        with:
          registry: registry.africastalking.dev
          username: ${{ secrets.AT_REGISTRY_USERNAME }}
          password: ${{ secrets.AT_REGISTRY_PASSWORD }}

      - name: Build and push GidaFix
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: registry.africastalking.dev/2nt9il/gidafix:latest
